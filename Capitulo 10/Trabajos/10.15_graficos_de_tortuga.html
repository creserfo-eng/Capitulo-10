<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio 10.15 - Gráficos de tortuga</title>
<style>body{font-family:Arial;max-width:850px;margin:25px auto;padding:0 16px}
textarea{width:100%;height:95px}button{padding:8px;margin:8px 0}
pre{font-family:monospace;line-height:1.15;background:#f3f3f3;padding:12px;overflow:auto}</style>
</head>
<body>
<h1>Ejercicio 10.15 - Gráficos de tortuga</h1>
<p>Comandos separados por comas o espacios. 1 pluma arriba, 2 abajo, 3 derecha, 4 izquierda,
5,n avanzar n espacios, 6 imprimir, 9 terminar.</p>
<textarea id="comandos">2,5,12,3,5,12,3,5,12,3,5,12,1,6,9</textarea>
<br><button id="ejecutar">Ejecutar comandos</button>
<div id="estado"></div><pre id="piso"></pre>
<script>
"use strict";
function ejecutar() {
  const piso = Array.from({length:20}, () => new Array(20).fill(0));
  let fila=0, columna=0, direccion=0; // 0 derecha, 1 abajo, 2 izquierda, 3 arriba
  let plumaAbajo=false, terminado=false;
  const tokens = document.getElementById("comandos").value.trim().split(/[,\s]+/).filter(Boolean).map(Number);
  let salida = "";
  for (let i=0; i<tokens.length && !terminado; i++) {
    const comando=tokens[i];
    if (comando===1) plumaAbajo=false;
    else if (comando===2) plumaAbajo=true;
    else if (comando===3) direccion=(direccion+1)%4;
    else if (comando===4) direccion=(direccion+3)%4;
    else if (comando===5) {
      const pasos = Number.isInteger(tokens[i+1]) ? tokens[++i] : 10;
      for (let p=0;p<pasos;p++) {
        if (plumaAbajo) piso[fila][columna]=1;
        const df=[0,1,0,-1][direccion], dc=[1,0,-1,0][direccion];
        const nuevaFila=fila+df, nuevaColumna=columna+dc;
        if (nuevaFila<0||nuevaFila>=20||nuevaColumna<0||nuevaColumna>=20) {
          salida="La tortuga llegó al borde del piso; se detuvo para no salir de la cuadrícula.";
          terminado=true; break;
        }
        fila=nuevaFila; columna=nuevaColumna;
      }
      if (plumaAbajo && !terminado) piso[fila][columna]=1;
    } else if (comando===6) {
      document.getElementById("piso").textContent =
        piso.map(f => f.map(v => v ? "*" : " ").join("")).join("\n");
    } else if (comando===9) terminado=true;
    else { salida=`Comando no reconocido: ${comando}`; terminado=true; }
  }
  document.getElementById("piso").textContent =
    piso.map(f => f.map(v => v ? "*" : " ").join("")).join("\n");
  document.getElementById("estado").textContent =
    `${salida} Posición final: fila ${fila}, columna ${columna}.`;
}
document.getElementById("ejecutar").addEventListener("click", ejecutar);
ejecutar();
</script>
</body></html>
